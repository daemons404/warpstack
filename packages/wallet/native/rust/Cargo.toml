[package]
name = "warpstack-vault"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
alloy-primitives = { version = "=1.7.3", default-features = false, features = ["std"] }
alloy-signer = { version = "=2.5.0" }
alloy-signer-local = { version = "=2.5.0", features = ["mnemonic"] }
alloy-sol-types = { version = "=1.7.3", default-features = false, features = ["std"] }
blake3 = { version = "=1.8.7", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
uniffi = { version = "=0.32.2", default-features = false }
zeroize = { version = "=1.9.1" }

[dev-dependencies]
serde_json = { version = "=1.0.154" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
