# Typecheck, lint, tests and the web build, on every PR and every push to main.
#
# PR safety (Phase 3): this runs on `pull_request`, never `pull_request_target`, so a PR's code
# runs with a read-only token and no secrets. Actions are pinned by commit; the token can only
# read; checkout keeps no credentials; the pnpm cache is written only from main, so a PR can't
# plant something a later run on main restores.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A PR checks out its merge commit; its first parent is the base the PR merges into.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ github.event_name == 'push' && 'pnpm' || '' }}
      # A frozen install doesn't apply minimumReleaseAge, so new lockfile entries are checked here.
      - name: New dependencies are at least 7 days old
        if: github.event_name == 'pull_request'
        run: |
          git show HEAD^1:pnpm-lock.yaml > "$RUNNER_TEMP/base-lock.yaml"
          node scripts/check-lockfile.mjs "$RUNNER_TEMP/base-lock.yaml" pnpm-lock.yaml
      - name: Nothing private is published
        run: sh scripts/scan-leaks.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @warpstack/app build:web

  create:
    name: create
    # create-warpstack-app as a user meets it: every package packed, an app generated outside
    # the checkout from those tarballs, then installed, typechecked, built, migrated locally and
    # dry-run deployed. The generated app installs from npm under its own 7-day release age.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ${{ github.event_name == 'push' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: sh scripts/rehearse-create.sh "$RUNNER_TEMP/rehearsal"
        env:
          CI: '1'

  workflows:
    name: workflows
    # The workflows themselves: syntax (actionlint) and security mistakes (zizmor), each pinned
    # by version and checksum.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/lint-workflows.sh
