# The phone's native vault (sealed): builds the Rust core for iOS, packages it, and compiles
# the app for the Simulator in Release, which compiles the vault's Swift against it. macOS
# minutes cost ten times Linux ones, so this runs only when the wallet package changes.
name: swift
on:
  pull_request:
    paths:
      - packages/wallet/**
      - .github/workflows/swift.yml
  push:
    branches: [main]
    paths:
      - packages/wallet/**
      - .github/workflows/swift.yml
permissions:
  contents: read
concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    name: ios
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Any https origin: the build only needs one to embed.
      EXPO_PUBLIC_API_URL: https://warpstack.example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # Tests, both iOS targets, uniffi's Swift bindings and the XCFramework. rustup installs
      # the toolchain and targets rust-toolchain.toml pins.
      - run: pnpm --filter @warpstack/wallet build:ios
      - name: Generate the iOS project
        working-directory: apps/app
        run: pnpm exec expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: apps/app/ios
        run: pod install
      # Release: Debug builds miss React Native's debug symbols here. The xcframework has only
      # an arm64 Simulator slice.
      - name: Build for the Simulator
        working-directory: apps/app/ios
        run: >
          xcodebuild -workspace Warpstack.xcworkspace -scheme Warpstack -configuration Release
          -sdk iphonesimulator ARCHS=arm64 -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
