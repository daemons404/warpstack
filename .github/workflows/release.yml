# Publishes every package to npm when a version tag (v0.2.0) is pushed, with npm's trusted
# publishing: no token is stored anywhere, and each package gets a provenance record linking it
# to this repository and commit. The tag must match the packages' version (scripts/publish-npm.sh
# checks). Runs in the `npm-publish` environment, which only `v*` tags may use.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read # check out the tagged commit
      id-token: write # prove to npm, through OIDC, that this workflow publishes (trusted publishing)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Node 24 ships the npm that trusted publishing needs (11.5.1 or later; publish-npm.sh
      # checks). No dependency cache: a release builds from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: sh scripts/publish-npm.sh --publish
