packages:
  - packages/*
  - apps/*

# Supply chain (overview, Keeping long-term maintenance safe): a 7-day minimum
# release age enforced by the tool, and install scripts only by allowlist.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@warpstack/*"
onlyBuiltDependencies:
  - esbuild
  - workerd

# Fixes inside tools, within the ranges they accept: node-forge 1.4.0 (Expo's CLI) and undici
# 7.29 (an older miniflare, from Cloudflare's vitest plugin) have known advisories that these
# versions fix. Drop each once its tool resolves to a fixed version itself.
overrides:
  node-forge: 1.4.2
  undici: 7.30.1

# One version per shared dependency; packages say `catalog:`. pnpm writes the
# real versions when a package is packed.
catalog:
  '@cloudflare/workers-types': '^5.20261006.1'
  '@farcaster/core': '0.20.0'
  '@noble/curves': '2.4.0'
  '@noble/hashes': '2.4.0'
  '@orpc/client': '2.0.0-beta.48'
  '@orpc/contract': '2.0.0-beta.48'
  '@orpc/json-schema': '2.0.0-beta.48'
  '@orpc/openapi': '2.0.0-beta.48'
  '@orpc/server': '2.0.0-beta.48'
  '@scure/bip39': '2.4.0'
  '@tanstack/react-query': '^5.105.3'
  '@types/node': '^22.20.5'
  '@types/react': '^19.1.0'
  '@types/react-dom': '^19.1.0'
  expo: '~58.0.14'
  expo-file-system: '58.0.9'
  expo-image: '58.0.15'
  expo-image-manipulator: '58.0.14'
  expo-image-picker: '~58.0.10'
  expo-router: '~58.0.23'
  expo-secure-store: '~58.0.2'
  hono: '^4.9.0'
  react: '19.3.0'
  react-dom: '19.3.0'
  react-native: '0.88.0'
  react-native-svg: '15.16.0'
  viem: '2.57.7'
  vitest: '^4.1.0'
  wrangler: '^4.30.0'
  zod: '^4.1.0'
